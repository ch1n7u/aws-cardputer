[env:m5stack-stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino

; Build flags
build_flags =
    -O2
    -Wall
    ; EC2 HTTPS calls run from the keyboard UI path on Arduino's loopTask.
    ; TLS + HTTPClient can exceed the default 8 KB stack on ESP32-S3.
    -DARDUINO_LOOP_STACK_SIZE=32768

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder   

; Library dependencies - REQUIRED for Milestone 1
lib_deps =
    m5stack/M5Cardputer @ ^1.1.1
    m5stack/M5Unified @ ^0.2.14
    m5stack/M5GFX @ ^0.2.20
    ArduinoJson @ ^6.21.6

; Additional built-in libraries (already in ESP32 core)
; WiFi, WiFiClientSecure, HTTPClient, Preferences, FreeRTOS

; Memory optimization
board_upload_speed = 921600
board_build.f_cpu = 240000000L

; Partition scheme for 8MB flash
board_build.partitions = default.csv
